<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Amber phosphor glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Vignette: subtle darkening at edges, like a CRT -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Scanlines: horizontal alternation -->
    <pattern id="scanlines" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#000" fill-opacity="0"/>
      <rect y="3" width="6" height="3" fill="#000" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- macOS-style squircle background. Big Sur+ uses r ≈ 22.5% of canvas. -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#0a0a0a"/>

  <!-- Inner CRT bezel: slight raised border so the screen looks recessed -->
  <rect x="120" y="180" width="784" height="664" rx="40" ry="40"
        fill="#050505" stroke="#1a1a1a" stroke-width="6"/>

  <!-- The prompt text. Monospaced amber phosphor with glow. The `>`
       already reads as the shell prompt indicator, so we skip the
       extra cursor block (which previously overlapped the `>` and
       looked like a strike-through line). -->
  <g filter="url(#glow)">
    <text x="512" y="610"
          font-family="Menlo, 'SF Mono', Monaco, 'Andale Mono', monospace"
          font-size="420" font-weight="700"
          fill="#FFB000"
          text-anchor="middle"
          letter-spacing="-10">xt&gt;</text>
  </g>

  <!-- Scanline overlay (subtle, doesn't fight the text) -->
  <rect x="120" y="180" width="784" height="664" rx="40" ry="40" fill="url(#scanlines)"/>

  <!-- Vignette on top of everything except the bezel exterior -->
  <rect x="120" y="180" width="784" height="664" rx="40" ry="40" fill="url(#vignette)"/>
</svg>
