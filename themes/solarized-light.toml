[theme]
name = "Solarized Light"

[theme.colors]
foreground = "#657B83"
background = "#FDF6E3"
cursor = "#657B83"
selection_fg = "#586E75"
selection_bg = "#EEE8D5"

[theme.colors.ansi]
black          = "#073642"
red            = "#DC322F"
green          = "#859900"
yellow         = "#B58900"
blue           = "#268BD2"
magenta        = "#D33682"
cyan           = "#2AA198"
white          = "#EEE8D5"
bright_black   = "#002B36"
bright_red     = "#CB4B16"
bright_green   = "#586E75"
bright_yellow  = "#657B83"
bright_blue    = "#839496"
bright_magenta = "#6C71C4"
bright_cyan    = "#93A1A1"
bright_white   = "#FDF6E3"

[theme.ui]
scrollbar_bg = "#FDF6E3"
scrollbar_thumb = "#D9D2BC"
scrollbar_thumb_hover = "#93A1A1"

# Tab bar. Values are "#RRGGBB", or "terminal" for the terminal background.
# Contrast checked: titles >= 4.5:1, markers >= 3:1 (WCAG 2.x).
[theme.ui.tabs]
bar_bg        = "#D9D2BC"
inactive_bg   = "#E4DDC8"
inactive_text = "#073642"
active_bg     = "#FDF6E3"
active_text   = "#073642"
active_marker = "#268BD2"
hover_bg      = "#EEE8D5"
activity      = "#CB4B16"
bell          = "#D33682"
