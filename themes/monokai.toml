[theme]
name = "Monokai"

[theme.colors]
foreground = "#F8F8F2"
background = "#272822"
cursor = "#F8F8F0"
selection_fg = "#F8F8F2"
selection_bg = "#49483E"

[theme.colors.ansi]
black          = "#272822"
red            = "#F92672"
green          = "#A6E22E"
yellow         = "#F4BF75"
blue           = "#66D9EF"
magenta        = "#AE81FF"
cyan           = "#A1EFE4"
white          = "#F8F8F2"
bright_black   = "#75715E"
bright_red     = "#F92672"
bright_green   = "#A6E22E"
bright_yellow  = "#F4BF75"
bright_blue    = "#66D9EF"
bright_magenta = "#AE81FF"
bright_cyan    = "#A1EFE4"
bright_white   = "#F9F8F5"

[theme.ui]
scrollbar_bg = "#272822"
scrollbar_thumb = "#49483E"
scrollbar_thumb_hover = "#75715E"

# Tab bar. Values are "#RRGGBB", or "terminal" for the terminal background.
# Contrast checked: titles >= 4.5:1, markers >= 3:1 (WCAG 2.x).
[theme.ui.tabs]
bar_bg        = "#1E1F1C"
inactive_bg   = "#272822"
inactive_text = "#F8F8F2"
active_bg     = "#49483E"
active_text   = "#F8F8F2"
active_marker = "#66D9EF"
hover_bg      = "#3E3D32"
activity      = "#FD971F"
bell          = "#F92672"
