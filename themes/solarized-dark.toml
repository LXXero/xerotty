[theme]
name = "Solarized Dark"

[theme.colors]
foreground = "#839496"
background = "#002B36"
cursor = "#839496"
selection_fg = "#93A1A1"
selection_bg = "#073642"

[theme.colors.ansi]
black          = "#073642"
red            = "#DC322F"
green          = "#859900"
yellow         = "#B58900"
blue           = "#268BD2"
magenta        = "#D33682"
cyan           = "#2AA198"
white          = "#EEE8D5"
bright_black   = "#002B36"
bright_red     = "#CB4B16"
bright_green   = "#586E75"
bright_yellow  = "#657B83"
bright_blue    = "#839496"
bright_magenta = "#6C71C4"
bright_cyan    = "#93A1A1"
bright_white   = "#FDF6E3"

[theme.ui]
scrollbar_bg = "#002B36"
scrollbar_thumb = "#073642"
scrollbar_thumb_hover = "#586E75"

# Tab bar. Values are "#RRGGBB", or "terminal" for the terminal background.
# Contrast checked: titles >= 4.5:1, markers >= 3:1 (WCAG 2.x).
[theme.ui.tabs]
bar_bg        = "#00212B"
inactive_bg   = "#002B36"
inactive_text = "#93A1A1"
active_bg     = "#073642"
active_text   = "#EEE8D5"
active_marker = "#268BD2"
hover_bg      = "#05323E"
activity      = "#B58900"
bell          = "#DC322F"
