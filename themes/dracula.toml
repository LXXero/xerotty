[theme]
name = "Dracula"

[theme.colors]
foreground = "#F8F8F2"
background = "#282A36"
cursor = "#F8F8F2"
selection_fg = "#F8F8F2"
selection_bg = "#44475A"

[theme.colors.ansi]
black          = "#21222C"
red            = "#FF5555"
green          = "#50FA7B"
yellow         = "#F1FA8C"
blue           = "#BD93F9"
magenta        = "#FF79C6"
cyan           = "#8BE9FD"
white          = "#F8F8F2"
bright_black   = "#6272A4"
bright_red     = "#FF6E6E"
bright_green   = "#69FF94"
bright_yellow  = "#FFFFA5"
bright_blue    = "#D6ACFF"
bright_magenta = "#FF92DF"
bright_cyan    = "#A4FFFF"
bright_white   = "#FFFFFF"

[theme.ui]
scrollbar_bg = "#282A36"
scrollbar_thumb = "#44475A"
scrollbar_thumb_hover = "#6272A4"

# Tab bar. Values are "#RRGGBB", or "terminal" for the terminal background.
# Contrast checked: titles >= 4.5:1, markers >= 3:1 (WCAG 2.x).
[theme.ui.tabs]
bar_bg        = "#191A21"
inactive_bg   = "#21222C"
inactive_text = "#F8F8F2"
active_bg     = "#44475A"
active_text   = "#F8F8F2"
active_marker = "#BD93F9"
hover_bg      = "#343746"
activity      = "#FFB86C"
bell          = "#FF5555"
