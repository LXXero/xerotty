# UI-only theme: tab bar and scrollbar colors, no terminal colors.
# Pair it with any terminal theme: [appearance] ui_theme = "neutral-dark"
[theme]
name = "Neutral Dark"

[theme.ui]
scrollbar_bg = "#202020"
scrollbar_thumb = "#4A4A4A"
scrollbar_thumb_hover = "#6A6A6A"

# Tab bar. Values are "#RRGGBB", or "terminal" for the terminal background.
# Contrast checked: titles >= 4.5:1, markers >= 3:1 (WCAG 2.x).
[theme.ui.tabs]
bar_bg        = "#161616"
inactive_bg   = "#202020"
inactive_text = "#E0E0E0"
active_bg     = "#3A3A3A"
active_text   = "#FFFFFF"
active_marker = "#6FA8FF"
hover_bg      = "#2C2C2C"
activity      = "#FFB000"
bell          = "#FF5C5C"
